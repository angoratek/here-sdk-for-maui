name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run unit tests
        run: dotnet test tests/HereSdk.Explore.Maui.Tests -c Release

  build-android:
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      HERE_SDK_DIST_TOKEN: ${{ secrets.HERE_SDK_DIST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install maui-android
      - name: Fetch HERE SDK (Android)
        run: ./scripts/fetch-sdk.sh android
      - name: Build Android binding
        # build-android.sh extracts the AAR from the cached SDK archive into
        # src/HereSdk.Explore.Android.Binding/Jars/ and builds the binding.
        run: ./scripts/build-android.sh
      - name: Build MAUI library (Android)
        run: dotnet build src/HereSdk.Explore.Maui -f net10.0-android -c Release

  build-ios:
    runs-on: macos-latest
    needs: unit-tests
    env:
      HERE_SDK_DIST_TOKEN: ${{ secrets.HERE_SDK_DIST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install maui-ios
      - name: Fetch HERE SDK (iOS)
        run: ./scripts/fetch-sdk.sh ios
      - name: Build iOS NativeBridge
        run: ./scripts/build-ios-native.sh
      # Note: no Objective-Sharpie step — the committed ApiDefinition.cs is
      # the source of truth; sharpie output requires manual fixup and does
      # not feed the build.
      - name: Build iOS binding
        run: dotnet build src/HereSdk.Explore.iOS.Binding -c Release
      - name: Build MAUI library (iOS)
        run: dotnet build src/HereSdk.Explore.Maui -f net10.0-ios -c Release