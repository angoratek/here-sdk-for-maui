name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

# Prevent concurrent publishes of the same tag (e.g. tag moved/repushed).
concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install maui
      - name: Build iOS NativeBridge
        run: ./scripts/build-ios-native.sh
      - name: Run Sharpie + fix bindings
        run: ./scripts/bind-ios.sh
      - name: Pack NuGet packages (with symbol packages)
        run: |
          dotnet pack src/HereSdk.Explore.Android.Binding \
            -c Release \
            -p:PackageVersion=${{ github.ref_name }} \
            -p:SymbolPackageFormat=snupkg \
            -p:IncludeSymbols=true
          dotnet pack src/HereSdk.Explore.iOS.Binding \
            -c Release \
            -p:PackageVersion=${{ github.ref_name }} \
            -p:SymbolPackageFormat=snupkg \
            -p:IncludeSymbols=true
          dotnet pack src/HereSdk.Explore.Maui \
            -c Release \
            -p:PackageVersion=${{ github.ref_name }} \
            -p:SymbolPackageFormat=snupkg \
            -p:IncludeSymbols=true
      - name: Publish packages to NuGet.org
        run: |
          dotnet nuget push "**/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate \
            --api-key ${{ secrets.NUGET_API_KEY }}
          dotnet nuget push "**/*.snupkg" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate \
            --api-key ${{ secrets.NUGET_API_KEY }}
      - name: Generate API documentation
        run: |
          dotnet tool install docfx --version 2.78.3 --tool-path "$RUNNER_TEMP/.dotnet-tools"
          "$RUNNER_TEMP/.dotnet-tools/docfx" docfx.json
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/docs