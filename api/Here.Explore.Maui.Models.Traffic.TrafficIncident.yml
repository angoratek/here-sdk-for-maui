  summary: A traffic incident.
  example: []
  syntax:
    content: public TrafficIncident(string Id, string Description, TrafficIncidentType Type, TrafficIncidentImpact Impact, GeoPolyline? Geometry = null, GeoCoordinates? Location = null, long? StartTime = null, long? EndTime = null, bool? RoadClosed = null)
    parameters:
    - id: Id
      type: System.String
      description: Stable identifier of the incident from the HERE traffic feed.
    - id: Description
      type: System.String
      description: Human-readable description (typically a localized road name + cause).
    - id: Type
      type: Here.Explore.Maui.Models.Traffic.TrafficIncidentType
      description: High-level category (accident, congestion, …).
    - id: Impact
      type: Here.Explore.Maui.Models.Traffic.TrafficIncidentImpact
      description: Severity of the delay (minor, major, closed, …).
    - id: Geometry
      type: Here.Explore.Maui.Models.GeoPolyline
      description: Optional road polyline covered by the incident.
    - id: Location
      type: Here.Explore.Maui.Models.GeoCoordinates
      description: >-
        First coordinate of the incident's polyline (the point on the road where

        the incident starts). Used by the RefApp to drop a marker on the map.

        On iOS this is read from <code>TrafficIncident.location.polyline.vertices.first</code>;

        on Android from <code>TrafficIncident.getLocation().getPolyline().getVertices().get(0)</code>.
    - id: StartTime
      type: System.Nullable{System.Int64}
      description: Optional start time as Unix epoch milliseconds.
    - id: EndTime
      type: System.Nullable{System.Int64}
      description: Optional end time as Unix epoch milliseconds.
    - id: RoadClosed
      type: System.Nullable{System.Boolean}
      description: True if the incident reports the road as fully closed.
